name: One-shot workspace and item UX

on:
  push:
    branches: [prerelease]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[workspace-items-ux]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply workspace anchoring and item accordion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"patch failed ({label}): {count} matches")
              return updated

          # ---- Dock: mount under central workspace and follow live editor geometry. ----
          p = Path("src/dock.ts")
          text = p.read_text()
          text = sub_once(
              text,
              r'(\s+private renderVersion = 0;\n)',
              r'\1  private geometryObserver: ResizeObserver | null = null;\n  private observedGeometryElements: Element[] = [];\n',
              "dock observer fields",
          )
          text = sub_once(
              text,
              r'this\.root = this\.document\.body\.createDiv\(\{ cls: "ledge-dock-root" \}\);\n\s*this\.root\.dataset\.ledgeDockRoot = "true";',
              'this.root = this.document.createElement("div");\n    this.root.className = "ledge-dock-root";\n    this.root.dataset.ledgeDockRoot = "true";\n    (this.workspaceHost() ?? this.document.body).appendChild(this.root);',
              "dock workspace mount",
          )
          text = sub_once(
              text,
              r'(if \(view\) this\.registerDomEvent\(view, "resize", \(\) => this\.refreshGeometryAndActiveState\(\)\);\n)(\s*this\.register\(\(\) => \{\n\s*this\.clearTimers\(\);)',
              r'\1    this.bindGeometryObserver();\n\2\n      this.geometryObserver?.disconnect();\n      this.geometryObserver = null;\n      this.observedGeometryElements = [];',
              "dock observer lifecycle",
          )
          text = sub_once(
              text,
              r'(if \(!this\.controller\.settings\(\)\.autoHide && !this\.visible\) this\.setVisible\(true\);\n)(\s*this\.positionAgainstRootPane\(\);)',
              r'\1    this.ensureWorkspaceHost();\n    this.bindGeometryObserver();\n\2',
              "dock live geometry refresh",
          )
          helpers = '''  private workspaceHost(): HTMLElement | null {
            const leaf = this.controller.leafForDocument(this.document);
            const leafContainer = leaf?.view?.containerEl;
            return leafContainer?.closest<HTMLElement>(".workspace-split.mod-root")
              ?? this.document.querySelector<HTMLElement>(".workspace-split.mod-root")
              ?? this.document.querySelector<HTMLElement>(".workspace");
          }

          private activeWorkspaceContent(
            leaf: WorkspaceLeaf | null,
            leafContainer: HTMLElement | undefined,
          ): HTMLElement | null {
            return (leaf?.view as { contentEl?: HTMLElement } | undefined)?.contentEl
              ?? leafContainer?.querySelector<HTMLElement>(".view-content")
              ?? leafContainer
              ?? null;
          }

          private ensureWorkspaceHost(): void {
            const host = this.workspaceHost();
            if (host && this.root.parentElement !== host) host.appendChild(this.root);
          }

          private bindGeometryObserver(): void {
            const ResizeObserverCtor = this.document.defaultView?.ResizeObserver;
            if (!ResizeObserverCtor) return;

            const host = this.workspaceHost();
            const leaf = this.controller.leafForDocument(this.document);
            const leafContainer = leaf?.view?.containerEl;
            const content = this.activeWorkspaceContent(leaf, leafContainer);
            const candidates = [host, content].filter((element): element is HTMLElement => Boolean(element));
            const elements = candidates.filter((element, index) => candidates.indexOf(element) === index);
            const unchanged = elements.length === this.observedGeometryElements.length
              && elements.every((element, index) => element === this.observedGeometryElements[index]);
            if (unchanged) return;

            if (!this.geometryObserver) {
              this.geometryObserver = new ResizeObserverCtor(() => this.refreshGeometryAndActiveState());
            } else {
              this.geometryObserver.disconnect();
            }
            this.observedGeometryElements = elements;
            for (const element of elements) this.geometryObserver.observe(element);
          }

'''
          text = sub_once(
              text,
              r'  private positionAgainstRootPane\(\): void \{',
              helpers + '  private positionAgainstRootPane(): void {',
              "dock workspace helpers",
          )
          anchor = '''  private anchorRectForPosition(
            _position: DockPosition,
            leaf: WorkspaceLeaf | null,
            leafContainer: HTMLElement | undefined,
            fallbackRect: DOMRect,
          ): DOMRect {
            const viewContent = this.activeWorkspaceContent(leaf, leafContainer);
            const contentRect = viewContent?.getBoundingClientRect();
            if (!contentRect || contentRect.width <= 0 || contentRect.height <= 0) return fallbackRect;
            return contentRect;
          }

'''
          text = sub_once(
              text,
              r'  private anchorRectForPosition\([\s\S]*?\n  private positionTrigger\(',
              anchor + '  private positionTrigger(',
              "all positions use active view content",
          )
          p.write_text(text)

          # ---- Base settings: expose item definition helpers to the accordion subclass. ----
          p = Path("src/settings-tab.ts")
          text = p.read_text()
          text = sub_once(text, r'  private itemPage\(', '  protected itemPage(', "protected itemPage")
          text = sub_once(text, r'  private targetExists\(', '  protected targetExists(', "protected targetExists")
          p.write_text(text)

          # ---- Actual settings tab: visible tab order + inline item accordion. ----
          p = Path("src/icon-library-setting-tab.ts")
          text = p.read_text()
          text = sub_once(text, r'  Notice,\n', '  Modal,\n  Notice,\n', "Modal import")
          text = sub_once(
              text,
              r'import \{ availableDockPositions, MAX_DOCK_PRESETS \} from "\./settings";',
              'import { availableDockPositions, createDockItem, MAX_DOCK_PRESETS } from "./settings";',
              "createDockItem import",
          )
          text = sub_once(
              text,
              r'const DOCK_SETTINGS_SECTIONS: DockSettingsSection\[\] = \[[\s\S]*?\n\];',
              '''const DOCK_SETTINGS_SECTIONS: DockSettingsSection[] = [
            "appearance",
            "layout",
            "behavior",
            "visibility",
            "items",
            "trigger",
          ];''',
              "dock tab order",
          )
          text = sub_once(
              text,
              r'private activeDockSection: DockSettingsSection = "items";',
              'private activeDockSection: DockSettingsSection = "appearance";',
              "default section",
          )
          text = sub_once(
              text,
              r'(\s+private activeDragHandle: HTMLButtonElement \| null = null;\n)',
              r'\1  private readonly expandedItemIds = new Set<string>();\n  private readonly itemDetailCleanups = new Map<string, Array<() => void>>();\n',
              "accordion state",
          )
          text = sub_once(
              text,
              r'(\s+options\?: Record<string, string>;\n)(\s+\};\n\s+render\?: \(setting: Setting\) => void;)',
              r'\1    min?: number;\n    max?: number;\n    step?: number;\n    placeholder?: string;\n\2',
              "mutable control metadata",
          )
          text = text.replace('  render?: (setting: Setting) => void;', '  render?: (setting: Setting) => void | (() => void);', 1)
          text = text.replace('  items?: SettingDefinitionItem[];\n};', '  visible?: () => boolean;\n  items?: SettingDefinitionItem[];\n};', 1)
          text = text.replace('    let itemDecoratorInserted = false;\n', '')
          text = sub_once(
              text,
              r'\s+if \(section === "items" && !itemDecoratorInserted\) \{[\s\S]*?itemDecoratorInserted = true;\n\s+\}\n\s+definitions\.push\(definition\);',
              '''
              if (section === "items") {
                definitions.push(this.dockItemsAccordionDefinition());
                continue;
              }
              definitions.push(definition);''',
              "replace item pages with accordion",
          )
          text = sub_once(
              text,
              r'\n  private itemRowDecoratorDefinition\(\): SettingDefinitionItem \{[\s\S]*?\n  \}\n\n  private applyDockSectionVisibility',
              '\n  private applyDockSectionVisibility',
              "remove old decorator definition",
          )

          modal_class = '''
          class ConfirmDockItemDeleteModal extends Modal {
            constructor(
              app: App,
              private readonly label: string,
              private readonly confirmDelete: () => void,
            ) {
              super(app);
            }

            onOpen(): void {
              this.setTitle("Delete dock item?");
              this.contentEl.createEl("p", {
                text: `Remove “${this.label}” from this Dock? This cannot be undone.`,
              });
              const actions = new Setting(this.contentEl);
              actions.settingEl.addClass("ledge-delete-confirmation-actions");
              actions.addButton((button) => button
                .setButtonText("Cancel")
                .onClick(() => this.close()));
              actions.addButton((button) => button
                .setButtonText("Delete item")
                .setIcon("trash-2")
                .setDestructive()
                .onClick(() => {
                  this.close();
                  this.confirmDelete();
                }));
            }
          }

'''
          text = sub_once(
              text,
              r'export class LedgeIconLibrarySettingTab',
              modal_class + 'export class LedgeIconLibrarySettingTab',
              "delete confirmation modal",
          )

          accordion = '''  private dockItemsAccordionDefinition(): SettingDefinitionItem {
            return {
              type: "group",
              heading: "Dock items",
              cls: "ledge-settings-panel-items",
              items: [{
                name: "Dock items",
                searchable: false,
                render: (setting) => {
                  setting.settingEl.addClass("ledge-items-accordion-setting");
                  setting.infoEl.setCssStyles({ display: "none" });
                  setting.controlEl.replaceChildren();
                  setting.controlEl.setCssStyles({ display: "block", width: "100%" });
                  const container = setting.controlEl.createDiv({ cls: "ledge-items-accordion" });
                  const cleanups: Array<() => void> = [];

                  if (this.ledgePlugin.settings.items.length === 0) {
                    container.createDiv({
                      cls: "ledge-items-empty-state",
                      text: "No dock items. Add one to create a shortcut.",
                    });
                  }
                  for (const [index, item] of this.ledgePlugin.settings.items.entries()) {
                    cleanups.push(this.renderDockItemAccordion(container, item.id, index));
                  }

                  const addRow = new Setting(container)
                    .setName("Add dock item")
                    .setDesc("Create a new shortcut and open its settings.");
                  addRow.settingEl.addClass("ledge-add-item-row");
                  addRow.addButton((button) => button
                    .setIcon("plus")
                    .setButtonText("Add item")
                    .onClick(() => {
                      const item = createDockItem(this.ledgePlugin.settings.items);
                      this.ledgePlugin.settings.items.push(item);
                      this.expandedItemIds.add(item.id);
                      void this.ledgePlugin.saveSettings().then(() => this.update());
                    }));

                  this.scheduleItemRowControls();
                  return () => {
                    for (const cleanup of cleanups) cleanup();
                    this.clearAllItemDetailCleanups();
                    this.clearItemDragState();
                  };
                },
              }],
            };
          }

          private renderDockItemAccordion(
            container: HTMLElement,
            itemId: string,
            index: number,
          ): () => void {
            const item = this.ledgePlugin.settings.items.find((candidate) => candidate.id === itemId);
            if (!item) return () => undefined;

            const wrapper = container.createDiv({ cls: "ledge-settings-item ledge-item-accordion" });
            const header = new Setting(wrapper)
              .setName(this.itemRowName(itemId, index))
              .setDesc(item.target || "No target path");
            header.settingEl.addClasses(["ledge-settings-item-header", "mod-navigable", "tappable"]);
            header.settingEl.dataset.ledgeItemId = itemId;

            header.controlEl.createSpan({
              cls: "ledge-item-row-state",
              text: item.enabled ? "Enabled" : "Hidden",
            });
            const warning = header.controlEl.createSpan({
              cls: "ledge-item-row-warning",
              attr: { "aria-label": "Target path is missing", title: "Target path is missing" },
            });
            setIcon(warning, "triangle-alert");
            warning.hidden = this.targetExists(item.target);

            const toggleButton = header.controlEl.createEl("button", {
              cls: "clickable-icon ledge-item-accordion-toggle",
              attr: { type: "button", "aria-label": "Toggle dock item settings" },
            });
            const details = wrapper.createDiv({ cls: "ledge-item-accordion-details" });

            const setExpanded = (expanded: boolean): void => {
              wrapper.classList.toggle("is-expanded", expanded);
              details.hidden = !expanded;
              toggleButton.setAttribute("aria-expanded", String(expanded));
              setIcon(toggleButton, expanded ? "chevron-down" : "chevron-right");
              if (expanded) {
                this.expandedItemIds.add(itemId);
                this.renderDockItemDetails(details, itemId);
              } else {
                this.expandedItemIds.delete(itemId);
                this.clearItemDetail(itemId);
                details.replaceChildren();
              }
            };
            const toggle = (): void => setExpanded(!this.expandedItemIds.has(itemId));
            const onToggle = (event: MouseEvent): void => {
              event.preventDefault();
              event.stopPropagation();
              toggle();
            };
            const onHeader = (event: MouseEvent): void => {
              const target = event.target as HTMLElement | null;
              if (target?.closest("button, input, select, textarea, a, .clickable-icon")) return;
              toggle();
            };
            toggleButton.addEventListener("click", onToggle);
            header.settingEl.addEventListener("click", onHeader);
            setExpanded(this.expandedItemIds.has(itemId));

            return () => {
              toggleButton.removeEventListener("click", onToggle);
              header.settingEl.removeEventListener("click", onHeader);
              this.clearItemDetail(itemId);
            };
          }

          private renderDockItemDetails(details: HTMLElement, itemId: string): void {
            const index = this.ledgePlugin.settings.items.findIndex((item) => item.id === itemId);
            const item = this.ledgePlugin.settings.items[index];
            if (!item) return;
            this.clearItemDetail(itemId);
            details.replaceChildren();

            const page = this.itemPage(item, index) as unknown as MutableSettingDefinition;
            const definitions = (page.items ?? []).filter((definition) =>
              (definition as unknown as MutableSettingDefinition).name !== "Delete dock item",
            );
            this.decorateControls(definitions);
            const cleanups: Array<() => void> = [];
            for (const definition of definitions) {
              const cleanup = this.renderDockItemSettingDefinition(details, definition, itemId);
              if (cleanup) cleanups.push(cleanup);
            }
            this.itemDetailCleanups.set(itemId, cleanups);
          }

          private renderDockItemSettingDefinition(
            container: HTMLElement,
            definition: SettingDefinitionItem,
            itemId: string,
          ): (() => void) | null {
            const mutable = definition as unknown as MutableSettingDefinition;
            if (mutable.visible && !mutable.visible()) return null;
            const setting = new Setting(container);
            if (mutable.name) setting.setName(mutable.name);
            if (mutable.desc) setting.setDesc(mutable.desc);
            if (mutable.render) return mutable.render(setting) ?? null;

            const control = mutable.control;
            const key = control?.key;
            if (!control?.type || !key) return null;
            const value = this.getControlValue(key);
            const commit = (nextValue: unknown): void => {
              void this.setControlValue(key, nextValue).then(() => {
                if (key.endsWith(":iconColorEnabled") || key.endsWith(":tileGradientEnabled")) {
                  this.renderDockItemDetails(container, itemId);
                }
              });
            };

            if (control.type === "toggle") {
              setting.addToggle((toggle) => toggle.setValue(value === true).onChange(commit));
            } else if (control.type === "dropdown") {
              setting.addDropdown((dropdown) => {
                if (control.options) dropdown.addOptions(control.options);
                dropdown.setValue(typeof value === "string" ? value : "");
                dropdown.onChange(commit);
              });
            } else if (control.type === "text") {
              setting.addText((input) => input
                .setPlaceholder(control.placeholder ?? "")
                .setValue(typeof value === "string" ? value : "")
                .onChange(commit));
            } else if (control.type === "slider") {
              const numeric = typeof value === "number" ? value : Number(value);
              setting.addSlider((slider) => slider
                .setLimits(control.min ?? 0, control.max ?? 100, control.step ?? 1)
                .setValue(Number.isFinite(numeric) ? numeric : 0)
                .setDynamicTooltip()
                .onChange(commit));
            } else if (control.type === "color") {
              setting.addColorPicker((picker) => picker
                .setValue(typeof value === "string" && value ? value : "#000000")
                .onChange(commit));
            }
            return null;
          }

          private clearItemDetail(itemId: string): void {
            const cleanups = this.itemDetailCleanups.get(itemId);
            if (!cleanups) return;
            this.itemDetailCleanups.delete(itemId);
            for (const cleanup of cleanups) cleanup();
          }

          private clearAllItemDetailCleanups(): void {
            for (const itemId of [...this.itemDetailCleanups.keys()]) this.clearItemDetail(itemId);
          }

          private confirmDeleteDockItem(itemId: string): void {
            const item = this.ledgePlugin.settings.items.find((candidate) => candidate.id === itemId);
            if (!item) return;
            new ConfirmDockItemDeleteModal(
              this.app,
              item.label || item.target || "Untitled item",
              () => {
                this.expandedItemIds.delete(itemId);
                this.ledgePlugin.settings.items = this.ledgePlugin.settings.items
                  .filter((candidate) => candidate.id !== itemId);
                void this.ledgePlugin.saveSettings().then(() => this.update());
              },
            ).open();
          }

'''
          text = sub_once(
              text,
              r'  private applyDockSectionVisibility\(\): void \{',
              accordion + '  private applyDockSectionVisibility(): void {',
              "accordion methods",
          )
          text = sub_once(
              text,
              r'(downButton\.addEventListener\("click", \(event: MouseEvent\) => \{[\s\S]*?this\.moveDockItem\(itemId, 1\);\n\s*\}\);)',
              r'''\1

              const deleteButton = controls.createEl("button", {
                cls: "clickable-icon ledge-item-delete-button",
                attr: { type: "button", "aria-label": "Delete dock item", title: "Delete dock item" },
              });
              setIcon(deleteButton, "trash-2");
              deleteButton.addEventListener("pointerdown", (event: PointerEvent) => event.stopPropagation());
              deleteButton.addEventListener("click", (event: MouseEvent) => {
                event.preventDefault();
                event.stopPropagation();
                this.confirmDeleteDockItem(itemId);
              });''',
              "header delete button",
          )
          p.write_text(text)

          # ---- CSS ----
          p = Path("styles.css")
          text = p.read_text()
          css = '''
          .ledge-items-accordion-setting {
            display: block;
            padding: 0;
            border: 0;
          }

          .ledge-items-accordion-setting > .setting-item-control,
          .ledge-items-accordion {
            width: 100%;
            display: block;
          }

          .ledge-items-accordion {
            display: grid;
            gap: var(--size-4-2);
          }

          .ledge-item-accordion {
            padding: 0;
            overflow: hidden;
          }

          .ledge-item-accordion > .setting-item {
            padding: var(--size-4-3);
            border: 0;
            cursor: pointer;
          }

          .ledge-item-accordion:not(.is-expanded) > .ledge-settings-item-header {
            border-bottom-color: transparent;
          }

          .ledge-item-accordion-details {
            padding: 0 var(--size-4-3) var(--size-4-2);
          }

          .ledge-item-accordion-details[hidden] {
            display: none;
          }

          .ledge-item-row-state {
            min-width: max-content;
            color: var(--text-muted);
            font-size: var(--font-ui-smaller);
          }

          .ledge-item-row-warning,
          .ledge-item-row-warning > svg {
            width: var(--icon-s);
            height: var(--icon-s);
            color: var(--text-warning);
          }

          .ledge-item-delete-button {
            color: var(--text-error);
          }

          .ledge-items-empty-state {
            padding: var(--size-4-4);
            border: 1px dashed var(--background-modifier-border);
            border-radius: var(--radius-m);
            color: var(--text-muted);
            text-align: center;
          }

          .ledge-delete-confirmation-actions .setting-item-info {
            display: none;
          }

'''
          text = sub_once(
              text,
              r'(\.ledge-settings-panel-items \{[\s\S]*?\n\})',
              r'\1\n' + css,
              "accordion css",
          )
          p.write_text(text)

          # ---- Regression source tests + changelog ----
          p = Path("tests/manifest.test.ts")
          text = p.read_text()
          extra_test = '''
          void test("workspace anchoring and Dock item accordion stay regression-covered", () => {
            const dock = fs.readFileSync("src/dock.ts", "utf8");
            const settings = fs.readFileSync("src/icon-library-setting-tab.ts", "utf8");

            assert.match(dock, /workspaceHost\(\)/);
            assert.match(dock, /ResizeObserver/);
            assert.match(dock, /activeWorkspaceContent/);
            assert.match(settings, /ConfirmDockItemDeleteModal extends Modal/);
            assert.match(settings, /ledge-item-accordion-toggle/);
            assert.match(settings, /ledge-item-delete-button/);
            assert.match(settings, /"appearance",[\s\S]*"layout",[\s\S]*"behavior",[\s\S]*"visibility",[\s\S]*"items",[\s\S]*"trigger"/);
          });

'''
          if 'workspace anchoring and Dock item accordion stay regression-covered' not in text:
              text += extra_test
          p.write_text(text)

          p = Path("CHANGELOG.md")
          text = p.read_text()
          if "Keep every Dock and trigger anchored to the active workspace content" not in text:
              text = text.replace(
                  "## Unreleased\n\n",
                  "## Unreleased\n\n"
                  "- Keep every Dock and trigger anchored to the active workspace content and observe live workspace geometry so collapsing or reopening sidebars repositions them immediately.\n"
                  "- Replace Dock item sub-pages with inline expandable accordions, move delete controls onto item rows with confirmation, and keep item identity stable while editing labels.\n"
                  "- Reorder Dock settings sections to Appearance → Layout → Behavior → Visibility → Items → Trigger.\n\n",
                  1,
              )
          p.write_text(text)
          PY
      - name: Validate
        run: |
          npm run check
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/dock.ts src/settings-tab.ts src/icon-library-setting-tab.ts styles.css tests/manifest.test.ts CHANGELOG.md main.js
          git commit -m "Keep Ledge inside workspace and simplify Dock items"
          git push origin prerelease
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-workspace-items-ux.yml
          git commit -m "Remove temporary workspace item UX workflow"
          git push origin prerelease
