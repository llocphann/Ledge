name: One-shot workspace and item UX

on:
  push:
    branches: [prerelease]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[workspace-items-ux]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          python3 .github/scripts/patch-workspace-items.py
          python3 .github/scripts/fix-item-accordion.py
      - name: Validate
        run: |
          npm run check
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/dock.ts src/icon-library-setting-tab.ts src/item-settings-accordion.ts styles.css tests/manifest.test.ts CHANGELOG.md main.js
          git commit -m "Keep Ledge inside workspace and simplify Dock items"
          git push origin prerelease
      - name: Remove temporary tooling
        run: |
          git rm .github/workflows/one-shot-workspace-items-ux.yml .github/scripts/patch-workspace-items.py .github/scripts/fix-item-accordion.py
          git commit -m "Remove temporary workspace item UX tooling"
          git push origin prerelease
