name: One-shot prerelease item settings optimization

on:
  push:
    branches:
      - prerelease
    paths:
      - .github/workflows/one-shot-prerelease-item-optimization.yml
      - .github/scripts/prerelease-item-optimization.py

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch and validate prerelease
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/prerelease-item-optimization.py /tmp/prerelease-item-optimization.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/prerelease-item-optimization.py')
          text = path.read_text()
          old = r'''  assert.doesNotMatch(base, /onReorder:[\s\S]{0,420}saveSettings\(\)\.then\(\(\) => this\.update\(\)\)/);'''
          new = r'''  assert.match(base, /heading: "Dock items"[\s\S]*onReorder: \(oldIndex, newIndex\) => \{[\s\S]*this\.ledge\.settings\.items\.splice\(newIndex, 0, item\);[\s\S]*void this\.ledge\.saveSettings\(\);[\s\S]*\},/);'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one regression assertion to replace, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 /tmp/prerelease-item-optimization.py
          npm ci
          npm run check
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/main.ts src/settings-tab.ts src/icon-library-setting-tab.ts styles.css tests/multi-dock.test.ts
          git commit -m "Optimize Dock item settings and reordering"
          git push origin prerelease

      - name: Remove temporary optimization tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin prerelease
          git rm .github/workflows/one-shot-prerelease-item-optimization.yml .github/scripts/prerelease-item-optimization.py
          git commit -m "Remove temporary prerelease optimization tooling"
          git push origin prerelease
