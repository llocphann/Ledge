name: Corner trigger geometry hotfix

on:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply corner trigger geometry hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore perpendicular corner pill joints
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'styles.css';
          let styles = fs.readFileSync(path, 'utf8');
          const marker = '/* Corner trigger pill joints: preserve arm size while making the shared corner explicitly perpendicular. */';
          if (styles.includes(marker)) process.exit(0);
          const anchor = `.ledge-dock-root[data-position="bottom-right"] .ledge-dock-trigger::before,\n.ledge-dock-root[data-position="bottom-right"] .ledge-dock-trigger::after {\n  right: 0;\n  bottom: 0;\n}\n`;
          if (!styles.includes(anchor)) throw new Error('Corner trigger anchor block not found');
          const rules = `\n${marker}\n.ledge-dock-root[data-position="top-left"] .ledge-dock-trigger::before {\n  border-radius: 0 var(--ledge-trigger-radius) var(--ledge-trigger-radius) 0;\n}\n\n.ledge-dock-root[data-position="top-left"] .ledge-dock-trigger::after {\n  border-radius: 0 0 var(--ledge-trigger-radius) var(--ledge-trigger-radius);\n}\n\n.ledge-dock-root[data-position="top-right"] .ledge-dock-trigger::before {\n  border-radius: var(--ledge-trigger-radius) 0 0 var(--ledge-trigger-radius);\n}\n\n.ledge-dock-root[data-position="top-right"] .ledge-dock-trigger::after {\n  border-radius: 0 0 var(--ledge-trigger-radius) var(--ledge-trigger-radius);\n}\n\n.ledge-dock-root[data-position="bottom-left"] .ledge-dock-trigger::before {\n  border-radius: 0 var(--ledge-trigger-radius) var(--ledge-trigger-radius) 0;\n}\n\n.ledge-dock-root[data-position="bottom-left"] .ledge-dock-trigger::after {\n  border-radius: var(--ledge-trigger-radius) var(--ledge-trigger-radius) 0 0;\n}\n\n.ledge-dock-root[data-position="bottom-right"] .ledge-dock-trigger::before {\n  border-radius: var(--ledge-trigger-radius) 0 0 var(--ledge-trigger-radius);\n}\n\n.ledge-dock-root[data-position="bottom-right"] .ledge-dock-trigger::after {\n  border-radius: var(--ledge-trigger-radius) var(--ledge-trigger-radius) 0 0;\n}\n`;
          styles = styles.replace(anchor, `${anchor}${rules}`);
          fs.writeFileSync(path, styles);
          NODE
      - name: Add corner pill regression coverage
        run: |
          cat > tests/corner-trigger-perpendicular.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          void test("corner trigger pills keep their size and meet at a perpendicular joint", () => {
            const dock = fs.readFileSync("src/dock.ts", "utf8");
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(dock, /const cornerExtent = Math\.max\(triggerSize \* 2\.6, 40\)/);
            assert.match(styles, /data-position\*="-"\] \.ledge-dock-trigger::before \{[\s\S]*?width: 72%;[\s\S]*?height: min\(100%, var\(--ledge-trigger-surface-thickness\)\)/);
            assert.match(styles, /data-position\*="-"\] \.ledge-dock-trigger::after \{[\s\S]*?width: min\(100%, var\(--ledge-trigger-surface-thickness\)\);[\s\S]*?height: 72%/);
            assert.match(styles, /data-position="top-left"\] \.ledge-dock-trigger::before \{[\s\S]*?border-radius: 0 var\(--ledge-trigger-radius\) var\(--ledge-trigger-radius\) 0;/);
            assert.match(styles, /data-position="top-left"\] \.ledge-dock-trigger::after \{[\s\S]*?border-radius: 0 0 var\(--ledge-trigger-radius\) var\(--ledge-trigger-radius\);/);
            assert.match(styles, /data-position="bottom-right"\] \.ledge-dock-trigger::before \{[\s\S]*?border-radius: var\(--ledge-trigger-radius\) 0 0 var\(--ledge-trigger-radius\);/);
            assert.match(styles, /data-position="bottom-right"\] \.ledge-dock-trigger::after \{[\s\S]*?border-radius: var\(--ledge-trigger-radius\) var\(--ledge-trigger-radius\) 0 0;/);
          });
          EOF
      - run: npm ci
      - run: npm run check
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css tests/corner-trigger-perpendicular.test.ts
          git commit -m "Fix perpendicular corner trigger pills"
          git push origin HEAD:stable
