name: One-shot prerelease audit fixes v2

on:
  push:
    branches: [prerelease]
    paths:
      - '.github/workflows/one-shot-prerelease-audit-fixes-v2.yml'

permissions:
  contents: write

jobs:
  audit-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch and validate prerelease
        run: |
          set -euo pipefail
          cp .github/scripts/prerelease-audit-fixes-v2.py /tmp/prerelease-audit-fixes-v2.py
          python3 /tmp/prerelease-audit-fixes-v2.py
          npm ci
          npm run check
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/icon-normalize.ts src/icon-provider.ts src/icon-cache.ts src/settings-tab.ts src/icon-library-setting-tab.ts tests/icon-normalize.test.ts tests/icon-cache.test.ts tests/multi-dock.test.ts CHANGELOG.md main.js
          git commit -m "Fix prerelease item titles and external icon rendering"
          git push origin prerelease
      - name: Remove temporary audit tooling
        if: always()
        run: |
          set -euo pipefail
          git fetch origin prerelease
          git reset --hard origin/prerelease
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git rm -f .github/workflows/one-shot-prerelease-audit-fixes-v2.yml .github/scripts/prerelease-audit-fixes-v2.py
          git commit -m "Remove temporary prerelease audit tooling"
          git push origin prerelease
