name: One-shot prepare 2.1.0

on:
  push:
    branches:
      - prerelease

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote changelog and bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text()
          marker = "## Unreleased\n\n"
          replacement = "## Unreleased\n\n## 2.1.0\n\n"
          if "## 2.1.0\n" not in text:
              if marker not in text:
                  raise SystemExit("Unreleased section not found")
              text = text.replace(marker, replacement, 1)
          p.write_text(text)
          PY
          npm version 2.1.0 --no-git-tag-version
      - name: Validate 2.1.0 release candidate
        run: npm run check
      - name: Re-audit release inputs for private paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Finance_Dashboard|Contact_Tracker|Instructional_Documents|Bodybuilding\.base|Media_Tracker|Book_Tracker|FoodnDrinks|20_Personal_Life|10_Projects|Obsidian-Vault|/home/|/Users/|C:\\Users\\'
          if grep -REn "$forbidden" src main.js manifest.json styles.css; then
            echo "Forbidden local/vault-specific path data found"
            exit 1
          fi
      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add CHANGELOG.md manifest.json package.json package-lock.json versions.json main.js
          git commit -m "Prepare Ledge 2.1.0"
          git push origin prerelease
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin prerelease
          git reset --hard origin/prerelease
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git rm -f .github/workflows/one-shot-prepare-2.1.0.yml
          git commit -m "Remove temporary 2.1.0 preparation workflow"
          git push origin prerelease
