name: Prepare release

on:
  push:
    branches:
      - dev
    paths:
      - ".ledge-release-version"

permissions:
  contents: write

concurrency:
  group: ledge-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read release version marker
        id: version
        shell: bash
        run: |
          if [ ! -f .ledge-release-version ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(tr -d '[:space:]' < .ledge-release-version)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci
      - name: Prepare tracked release assets
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          node version-bump.mjs
          npm run check

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages?.['']?.version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          MIN_APP_VERSION="$(node -p "require('./manifest.json').minAppVersion")"
          VERSIONS_MIN_APP="$(node -p "require('./versions.json')[require('./manifest.json').version]")"

          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$LOCK_VERSION"
          test "$VERSION" = "$LOCK_ROOT_VERSION"
          test "$VERSION" = "$MANIFEST_VERSION"
          test "$MIN_APP_VERSION" = "$VERSIONS_MIN_APP"

          rm .ledge-release-version
          git diff --check

          UNEXPECTED="$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|manifest\.json|versions\.json|main\.js|\.ledge-release-version)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "Unexpected files changed during release preparation:"
            echo "$UNEXPECTED"
            exit 1
          fi
      - name: Commit prepared release state
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json main.js .ledge-release-version
          git commit -m "chore: prepare Ledge $VERSION"
          git push origin HEAD:dev
