name: One-shot prerelease pointer reorder fix

on:
  push:
    branches: [prerelease]
    paths:
      - .github/workflows/one-shot-prerelease-pointer-reorder-fix.yml
      - .github/scripts/prerelease-pointer-reorder-fix.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch and validate pointer reorder
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/prerelease-pointer-reorder-fix.py /tmp/prerelease-pointer-reorder-fix.py
          python3 /tmp/prerelease-pointer-reorder-fix.py
          npm ci
          npm run check
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/icon-library-setting-tab.ts styles.css tests/multi-dock.test.ts CHANGELOG.md main.js
          git commit -m "Fix pointer drag reorder in settings"
          git push origin prerelease
      - name: Remove temporary pointer reorder tooling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin prerelease
          git reset --hard origin/prerelease
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git rm -f .github/workflows/one-shot-prerelease-pointer-reorder-fix.yml .github/scripts/prerelease-pointer-reorder-fix.py
          git commit -m "Remove temporary pointer reorder tooling"
          git push origin prerelease
