name: Release

on:
  push:
    branches:
      - stable
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  tag:
    if: github.ref == 'refs/heads/stable' && startsWith(github.event.head_commit.message, 'Release Ledge ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync package lock and create release tag
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "${GITHUB_REF_NAME}" = "stable"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./manifest.json');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = manifest.version;
          if (lock.packages?.['']) lock.packages[''].version = manifest.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync package lock for ${VERSION}"
            git push origin HEAD:stable
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi
          git tag "$VERSION" "$(git rev-parse HEAD)"
          git push origin "$VERSION"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag and manifest version
        run: |
          node -e "const manifest=require('./manifest.json'); if (process.env.GITHUB_REF_NAME !== manifest.version) process.exit(1)"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
