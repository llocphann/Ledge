name: One-shot prerelease item settings polish

on:
  push:
    branches:
      - prerelease
    paths:
      - .github/workflows/one-shot-prerelease-item-polish.yml
      - .github/scripts/prerelease-item-polish.py

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch and validate prerelease
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/prerelease-item-polish.py /tmp/prerelease-item-polish.py
          python3 /tmp/prerelease-item-polish.py
          npm ci
          npm run check
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add src/settings-tab.ts src/icon-library-setting-tab.ts styles.css tests/multi-dock.test.ts main.js
          git commit -m "Polish Dock item reordering and target suggestions"
          git push origin prerelease

      - name: Remove temporary polish tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin prerelease
          git rm .github/workflows/one-shot-prerelease-item-polish.yml .github/scripts/prerelease-item-polish.py
          git commit -m "Remove temporary prerelease polish tooling"
          git push origin prerelease
