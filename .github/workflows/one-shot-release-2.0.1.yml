name: One-shot 2.0.1 hotfix release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-release-2.0.1.yml

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare and validate 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release-2.0.1.py
          npm ci
          npm run check
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const manifest = require('./manifest.json');
          const versions = require('./versions.json');
          if (pkg.version !== '2.0.1') throw new Error('package.json version mismatch');
          if (manifest.version !== '2.0.1') throw new Error('manifest.json version mismatch');
          if (versions['2.0.1'] !== manifest.minAppVersion) throw new Error('versions.json mismatch');
          for (const asset of ['main.js', 'manifest.json', 'styles.css']) {
            if (!fs.existsSync(asset) || fs.statSync(asset).size === 0) throw new Error(`Missing release asset: ${asset}`);
          }
          NODE

      - name: Commit release candidate and tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add package.json package-lock.json manifest.json versions.json CHANGELOG.md
          git add -f main.js
          git commit -m "Release 2.0.1 hotfix"
          git push origin main
          git tag 2.0.1
          git push origin 2.0.1

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish 2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Hotfix

          - Fix a freeze when opening or editing a Dock item's **Target path** in large vaults by replacing the eager vault-wide file control with a bounded lazy suggester.
          - Limit Target path suggestions to 50 relevant Markdown, Base, and Canvas files while excluding `.git` and `node_modules` paths.

          This release contains the freeze hotfix only; the broader settings and reorder optimizations remain on `prerelease`.
          EOF
          gh release create 2.0.1 main.js manifest.json styles.css \
            --title "Ledge 2.0.1" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      - name: Remove temporary release tooling
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/one-shot-release-2.0.1.yml .github/scripts/release-2.0.1.py
          git commit -m "Remove temporary 2.0.1 release tooling"
          git push origin main
