name: Unified corner trigger hotfix

on:
  push:
    branches: [stable]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply unified corner trigger surface hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replace split corner pills with one masked surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          styles = path.read_text()
          start_marker = '.ledge-dock-root[data-position*="-"] .ledge-dock-trigger::before {'
          end_marker = '.ledge-dock-trigger:hover::before,'
          start = styles.index(start_marker)
          end = styles.index(end_marker, start)

          unified = r'''.ledge-dock-root[data-position*="-"] .ledge-dock-trigger {
            --ledge-corner-arm-length: 72%;
            --ledge-corner-mask-thickness: min(100%, var(--ledge-trigger-surface-thickness));
          }

          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger::before {
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0;
            background:
              linear-gradient(
                var(--ledge-trigger-angle),
                color-mix(in srgb, var(--ledge-trigger-start) var(--ledge-trigger-opacity), transparent),
                color-mix(in srgb, var(--ledge-trigger-end) var(--ledge-trigger-opacity), transparent)
              );
            box-shadow: none;
            filter:
              drop-shadow(
                var(--ledge-trigger-border-width) 0 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                calc(0px - var(--ledge-trigger-border-width)) 0 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                0 var(--ledge-trigger-border-width) 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                0 calc(0px - var(--ledge-trigger-border-width)) 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(0 5px 9px color-mix(in srgb, var(--background-primary) 54%, transparent));
            mask-repeat: no-repeat;
          }

          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger::after {
            content: none;
          }

          .ledge-dock-root[data-position="top-left"] .ledge-dock-trigger::before {
            mask:
              linear-gradient(#000 0 0)
                left 0 top 0 /
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2)
                var(--ledge-corner-mask-thickness) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                left calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) top 0 /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat,
              linear-gradient(#000 0 0)
                left 0 top 0 /
                var(--ledge-corner-mask-thickness)
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                left 0 top calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat;
          }

          .ledge-dock-root[data-position="top-right"] .ledge-dock-trigger::before {
            mask:
              linear-gradient(#000 0 0)
                right 0 top 0 /
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2)
                var(--ledge-corner-mask-thickness) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                right calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) top 0 /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat,
              linear-gradient(#000 0 0)
                right 0 top 0 /
                var(--ledge-corner-mask-thickness)
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                right 0 top calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat;
          }

          .ledge-dock-root[data-position="bottom-left"] .ledge-dock-trigger::before {
            mask:
              linear-gradient(#000 0 0)
                left 0 bottom 0 /
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2)
                var(--ledge-corner-mask-thickness) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                left calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) bottom 0 /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat,
              linear-gradient(#000 0 0)
                left 0 bottom 0 /
                var(--ledge-corner-mask-thickness)
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                left 0 bottom calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat;
          }

          .ledge-dock-root[data-position="bottom-right"] .ledge-dock-trigger::before {
            mask:
              linear-gradient(#000 0 0)
                right 0 bottom 0 /
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2)
                var(--ledge-corner-mask-thickness) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                right calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) bottom 0 /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat,
              linear-gradient(#000 0 0)
                right 0 bottom 0 /
                var(--ledge-corner-mask-thickness)
                calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness) / 2) no-repeat,
              radial-gradient(circle, #000 98%, transparent 100%)
                right 0 bottom calc(var(--ledge-corner-arm-length) - var(--ledge-corner-mask-thickness)) /
                var(--ledge-corner-mask-thickness) var(--ledge-corner-mask-thickness) no-repeat;
          }

          .ledge-dock-root.is-trigger-background-hidden[data-position*="-"] .ledge-dock-trigger::before {
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
          }

          .ledge-dock-root.is-trigger-border-hidden[data-position*="-"] .ledge-dock-trigger::before {
            filter: drop-shadow(0 5px 9px color-mix(in srgb, var(--background-primary) 54%, transparent));
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position*="-"]
            .ledge-dock-trigger::before,
          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position*="-"]
            .ledge-dock-trigger::after {
            content: "";
            border: var(--ledge-trigger-border-width) solid
              color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent);
            background: transparent;
            box-shadow: none;
            filter: none;
            backdrop-filter: none;
            mask: none;
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position*="-"]
            .ledge-dock-trigger::before {
            inset: auto;
            width: 72%;
            height: min(100%, var(--ledge-trigger-surface-thickness));
            border-radius: var(--ledge-trigger-radius);
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position*="-"]
            .ledge-dock-trigger::after {
            width: min(100%, var(--ledge-trigger-surface-thickness));
            height: 72%;
            border-radius: var(--ledge-trigger-radius);
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="top-left"]
            .ledge-dock-trigger::before,
          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="top-left"]
            .ledge-dock-trigger::after {
            top: 0;
            left: 0;
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="top-right"]
            .ledge-dock-trigger::before,
          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="top-right"]
            .ledge-dock-trigger::after {
            top: 0;
            right: 0;
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="bottom-left"]
            .ledge-dock-trigger::before,
          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="bottom-left"]
            .ledge-dock-trigger::after {
            bottom: 0;
            left: 0;
          }

          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="bottom-right"]
            .ledge-dock-trigger::before,
          .ledge-dock-root.is-trigger-background-hidden:not(.is-trigger-border-hidden)[data-position="bottom-right"]
            .ledge-dock-trigger::after {
            right: 0;
            bottom: 0;
          }

          '''

          styles = styles[:start] + unified + styles[end:]

          hover_anchor = '''.ledge-dock-trigger:hover::before,
          .ledge-dock-trigger:focus-visible::before,
          .ledge-dock-trigger.is-visible::before,
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger:hover::after,
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger:focus-visible::after,
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger.is-visible::after {
            filter: brightness(1.14);
            opacity: 1;
            box-shadow:
              inset 0 1px color-mix(in srgb, var(--text-normal) 13%, transparent),
              0 7px 22px color-mix(in srgb, var(--ledge-accent) 24%, transparent);
          }
          '''
          corner_hover = '''
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger:hover::before,
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger:focus-visible::before,
          .ledge-dock-root[data-position*="-"] .ledge-dock-trigger.is-visible::before {
            filter:
              brightness(1.14)
              drop-shadow(
                var(--ledge-trigger-border-width) 0 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                calc(0px - var(--ledge-trigger-border-width)) 0 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                0 var(--ledge-trigger-border-width) 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(
                0 calc(0px - var(--ledge-trigger-border-width)) 0
                color-mix(in srgb, var(--ledge-trigger-border-color) 82%, transparent)
              )
              drop-shadow(0 7px 11px color-mix(in srgb, var(--ledge-accent) 24%, transparent));
            box-shadow: none;
          }

          .ledge-dock-root.is-trigger-border-hidden[data-position*="-"] .ledge-dock-trigger:hover::before,
          .ledge-dock-root.is-trigger-border-hidden[data-position*="-"] .ledge-dock-trigger:focus-visible::before,
          .ledge-dock-root.is-trigger-border-hidden[data-position*="-"] .ledge-dock-trigger.is-visible::before {
            filter:
              brightness(1.14)
              drop-shadow(0 7px 11px color-mix(in srgb, var(--ledge-accent) 24%, transparent));
          }
          '''
          if hover_anchor not in styles:
              raise SystemExit('Hover anchor not found')
          styles = styles.replace(hover_anchor, hover_anchor + corner_hover, 1)
          path.write_text(styles)

          Path('tests/corner-trigger-perpendicular.test.ts').write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          void test("corner trigger uses one continuous masked surface without changing its geometry", () => {
            const dock = fs.readFileSync("src/dock.ts", "utf8");
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(dock, /const cornerExtent = Math\.max\(triggerSize \* 2\.6, 40\)/);
            assert.match(styles, /--ledge-corner-arm-length: 72%/);
            assert.match(styles, /--ledge-corner-mask-thickness: min\(100%, var\(--ledge-trigger-surface-thickness\)\)/);
            assert.match(styles, /data-position="top-left"\] \.ledge-dock-trigger::before \{[\s\S]*?mask:/);
            assert.match(styles, /radial-gradient\(circle, #000 98%, transparent 100%\)/);
            assert.match(styles, /data-position\*="-"\] \.ledge-dock-trigger::after \{[\s\S]*?content: none;/);
            assert.match(styles, /linear-gradient\([\s\S]*?var\(--ledge-trigger-angle\)[\s\S]*?var\(--ledge-trigger-start\)[\s\S]*?var\(--ledge-trigger-end\)/);
            assert.match(styles, /is-trigger-background-hidden:not\(\.is-trigger-border-hidden\)[\s\S]*?\.ledge-dock-trigger::after/);
          });
          ''')

          for test_path in ['tests/manifest.test.ts', 'tests/multi-dock.test.ts']:
              p = Path(test_path)
              text = p.read_text()
              if test_path.endswith('manifest.test.ts'):
                  old = r'''void test("corner trigger pills use perpendicular rounded arms", () => {
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(
              styles,
              /\[data-position\*="-"\] \.ledge-dock-trigger::before \{[\s\S]*?width: 72%;[\s\S]*?border-radius: var\(--ledge-trigger-radius\);/,
            );
            assert.match(
              styles,
              /\[data-position\*="-"\] \.ledge-dock-trigger::after \{[\s\S]*?height: 72%;[\s\S]*?border-radius: var\(--ledge-trigger-radius\);/,
            );
          });'''
                  new = r'''void test("corner trigger surface is one continuous perpendicular block", () => {
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(styles, /--ledge-corner-arm-length: 72%/);
            assert.match(styles, /data-position="top-left"\] \.ledge-dock-trigger::before \{[\s\S]*?mask:/);
            assert.match(styles, /data-position="bottom-right"\] \.ledge-dock-trigger::before \{[\s\S]*?mask:/);
            assert.match(styles, /data-position\*="-"\] \.ledge-dock-trigger::after \{[\s\S]*?content: none;/);
          });'''
              else:
                  old = r'''void test("corner triggers render as perpendicular pill arms instead of a square", () => {
            const source = fs.readFileSync("src/dock.ts", "utf8");
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(source, /const cornerExtent = Math\.max\(triggerSize \* 2\.6, 40\)/);
            assert.match(styles, /data-position\*="-"[^\n]*ledge-dock-trigger::after/);
            assert.match(styles, /width: 72%/);
            assert.match(styles, /height: 72%/);
          });'''
                  new = r'''void test("corner triggers keep their geometry while using one continuous surface", () => {
            const source = fs.readFileSync("src/dock.ts", "utf8");
            const styles = fs.readFileSync("styles.css", "utf8");

            assert.match(source, /const cornerExtent = Math\.max\(triggerSize \* 2\.6, 40\)/);
            assert.match(styles, /--ledge-corner-arm-length: 72%/);
            assert.match(styles, /--ledge-corner-mask-thickness: min\(100%, var\(--ledge-trigger-surface-thickness\)\)/);
            assert.match(styles, /data-position\*="-"\] \.ledge-dock-trigger::after \{[\s\S]*?content: none;/);
          });'''
              if old not in text:
                  raise SystemExit(f'test anchor not found: {test_path}')
              p.write_text(text.replace(old, new, 1))
          PY
      - run: npm run check
      - name: Commit validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/unified-corner-trigger-hotfix.yml
          git add styles.css tests/corner-trigger-perpendicular.test.ts tests/manifest.test.ts tests/multi-dock.test.ts
          git commit -m "Unify corner trigger gradient surface"
          git push origin HEAD:stable
