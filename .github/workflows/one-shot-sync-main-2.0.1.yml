name: One-shot sync main 2.0.1 into prerelease

on:
  push:
    branches:
      - prerelease
    paths:
      - .github/workflows/one-shot-sync-main-2.0.1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git fetch origin main

          set +e
          git merge --no-ff origin/main -m "Merge Ledge 2.0.1 into prerelease"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "main.js" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours main.js
            git add main.js
          fi

          npm ci
          npm run check
          git add main.js

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "Rebuild prerelease bundle after 2.0.1 sync"
          fi

          git push origin prerelease

      - name: Remove temporary sync workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin prerelease
          git rm .github/workflows/one-shot-sync-main-2.0.1.yml
          git commit -m "Remove temporary prerelease sync workflow"
          git push origin prerelease
