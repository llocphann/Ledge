name: One-shot scoped corner stylelint fix

on:
  push:
    branches: [prerelease]
    paths:
      - .github/workflows/one-shot-corner-stylelint-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
      - name: Scope stylelint specificity exception
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          text = path.read_text()
          start = '.ledge-dock-trigger::before,\n.ledge-dock-root[data-position*="-"] .ledge-dock-trigger::after {\n'
          state = '''.ledge-dock-trigger:hover::before,\n.ledge-dock-trigger:focus-visible::before,\n.ledge-dock-trigger.is-visible::before,\n.ledge-dock-root[data-position*="-"] .ledge-dock-trigger:hover::after,\n.ledge-dock-root[data-position*="-"] .ledge-dock-trigger:focus-visible::after,\n.ledge-dock-root[data-position*="-"] .ledge-dock-trigger.is-visible::after {\n  filter: brightness(1.14);\n  opacity: 1;\n  box-shadow:\n    inset 0 1px color-mix(in srgb, var(--text-normal) 13%, transparent),\n    0 7px 22px color-mix(in srgb, var(--ledge-accent) 24%, transparent);\n}\n'''
          if start not in text:
              raise SystemExit('trigger pseudo start not found')
          if state not in text:
              raise SystemExit('trigger state block not found')
          text = text.replace(start, '/* stylelint-disable no-descending-specificity -- stateful corner trigger pseudo-elements intentionally share geometry */\n' + start, 1)
          text = text.replace(state, state + '/* stylelint-enable no-descending-specificity */\n', 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
          git add styles.css
          git commit -m "Scope corner trigger specificity lint [skip ci]"
          git push origin HEAD:prerelease
