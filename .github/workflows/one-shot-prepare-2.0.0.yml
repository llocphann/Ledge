name: One-shot prepare 2.0.0

on:
  push:
    branches: [prerelease]
    paths:
      - .github/workflows/one-shot-prepare-2.0.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prerelease
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure git
        run: |
          git config user.name "Lunarch"
          git config user.email "phantanlocct@outlook.com"
      - name: Bump to 2.0.0 and build release bundle
        run: |
          npm version 2.0.0 --no-git-tag-version
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./manifest.json');
          const versions = require('./versions.json');
          if (pkg.version !== '2.0.0') throw new Error('package.json version mismatch');
          if (manifest.version !== '2.0.0') throw new Error('manifest.json version mismatch');
          if (lock.version !== '2.0.0' || lock.packages?.['']?.version !== '2.0.0') throw new Error('package-lock.json version mismatch');
          if (lock.packages?.['']?.engines?.node !== '>=22') throw new Error('package-lock Node engine mismatch');
          if (versions['2.0.0'] !== manifest.minAppVersion) throw new Error('versions.json missing 2.0.0');
          for (const path of ['main.js', 'manifest.json', 'styles.css']) {
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`${path} missing or empty`);
          }
          NODE
      - name: Commit 2.0.0 release state
        run: |
          git add package.json package-lock.json manifest.json versions.json
          git add -f main.js
          git commit -m "Release 2.0.0"
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-prepare-2.0.0.yml
          git commit -m "Remove one-shot 2.0.0 preparation workflow"
          git push origin HEAD:prerelease
